# Secret scope for persona service-principal OAuth credentials (M6 / M8).
# The bundle creates the empty scope; the SA adds values with `databricks secrets put-secret`
# (docs/README.md#persona-credentials). No secret values are stored in this repo.
resources:
  secret_scopes:
    persona_credentials:
      name: ${var.secret_scope}
      backend_type: DATABRICKS
      permissions:
        - group_name: ${var.security_group}
          level: READ
